services:
  - type: web
    name: responsible-fin-ai-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    plan: free
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
    disk:
      name: chromadb_storage
      mountPath: /opt/render/project/src/chroma_db
      sizeGB: 2

  - type: web
    name: responsible-fin-ai-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run preview -- --host 0.0.0.0 --port 10000"
    staticPublishPath: dist
    plan: free
